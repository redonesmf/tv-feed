name: Refresh and publish TV feed

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Recheck sources and rebuild the programme guide
        type: boolean
        default: true
      guide_only:
        description: Update listings without checking or changing stream URLs
        type: boolean
        default: false
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: tv-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Choose cache interval
        id: cache-key
        run: echo "value=$(date -u +%Y-%m-%d)-$(( $(date -u +%H | sed 's/^0//;s/^$/0/') / 12 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/epg-*.xml.gz
          key: epg-${{ steps.cache-key.outputs.value }}
      - name: Test guide matching
        run: python -m unittest discover -s tests -v
      - name: Refresh public sources
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          hour=$(date -u +%H)
          if [ "${{ inputs.guide_only }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "05" ] && [ "$hour" != "17" ]; }; then
            python scripts/refresh.py --guide-only
          else
            python scripts/refresh.py
          fi
      - name: Validate files before publication
        run: python scripts/validate_feed.py
      - name: Save refreshed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/p.m3u data/g.xml data/status.json data/guide.m3u data/coverage.json data/uk.m3u data/nfl.m3u data/daily.m3u
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh channel links and programme listings'
            git -c credential.helper='!gh auth git-credential' push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: data

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish read-only feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
